# HP Photosmart C4380 — native macOS print pipeline configuration
# Sourced by bin/pdf2c4380.sh and bin/start-server.sh

# Printer's IP address on the LAN (raw JetDirect / port 9100).
# Leave blank to auto-discover via bin/find-printer.sh
PRINTER_IP=""
PRINTER_PORT=9100

# Ghostscript output device. Candidates, best first:
#   chp2200 - emits explicit "@PJL ENTER LANGUAGE=PCL3GUI" (preferred)
#   cdj970  - PCL3GUI mode-9 compression, DeskJet 970 lineage
#   cdj890  - PCL3GUI mode-9, DeskJet 890
#   cdj550  - oldest/safest fallback, larger output
GS_DEVICE="chp2200"

# Print resolution in DPI (300 is the C4380's normal mode; 600 for photo)
RESOLUTION=300

# Local IPP port that macOS will connect to
IPP_PORT=8632

# Service name shown to macOS
SERVICE_NAME="Photosmart C4380 (Kerchunk)"

# Advertise to iOS/iPadOS AirPrint. Requires a "URF" key in the DNS-SD TXT
# record, which means using ippeveprinter's -a attributes file (mutually
# exclusive with -M/-m/-f/-s). Set to 0 to fall back to the plain setup.
AIRPRINT=1

# ---------------------------------------------------------------- scanning
# The scanner speaks SCL on its own TCP port, independent of printing.
SCAN_PORT=9290

# Local port for the eSCL/AirScan server (bin/escl-server.py).
ESCL_PORT=8633

# Address to bind. Empty = all interfaces, which is what discovery from
# other devices requires. Set to 127.0.0.1 to keep it host-local.
ESCL_BIND=""

# How the scanner presents itself to Image Capture / AirScan clients.
SCAN_SERVICE_NAME="Photosmart C4380 (Kerchunk)"
SCAN_MODEL="HP Photosmart C4380"

# JPEG quality the device encodes at: 0-100, higher is better.
#
# Careful: SCL's own knob is a *compression* factor where higher means worse,
# and it is sent inverted. Measured on this device, 75 dpi colour, same page:
#   quality 100 -> 406 kB   quality 90 -> 98 kB   quality 50 -> 43 kB
#   quality  95 -> 134 kB   quality 75 -> 62 kB   quality 10 -> 31 kB
# 100 is the default; drop it if scans are larger than you want.
SCAN_JPEG_QUALITY=100

# Device icons shown in the macOS/iOS printer and scanner pickers.
# Leave unset to use share/icons/{printer,scanner}.png next to the scripts.
#PRINTER_ICON=""
#SCANNER_ICON=""

# Firmware sharpening, -128..127 (0 = off). This one is real hardware: the
# scanner implements SCL's sharpening command and the effect is visible.
# HP's other enhancement options -- Descreen, Colour Restoration, Adaptive
# Lighting -- have no SCL equivalent and are done in HP's driver software,
# so they are not available here.
SCAN_SHARPEN=0

# 48-bit colour is available to clients as eSCL "RGB48" but is never the
# default: it cannot be JPEG-compressed, so a 300 dpi page is ~54 MB and
# takes ~5 minutes. It also requires 300 dpi or more.
